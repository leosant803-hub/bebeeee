<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La heroína que salvó y cambió mi mundo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1025;
            font-family: 'Courier New', Courier, monospace;
        }

        #orientation-warning {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 16, 37, 0.98);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffd1dc;
            padding: 20px;
        }

        .warning-content h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ff8da1;
        }

        .warning-content p {
            font-size: 1.1rem;
            line-height: 1.5;
        }

        @media screen and (orientation: portrait) {
            #orientation-warning {
                display: flex;
            }
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .hidden {
            display: none !important;
        }

        #touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px;
        }

        #dpad {
            position: relative;
            width: 140px;
            height: 140px;
            pointer-events: auto;
            margin-bottom: 10px;
            margin-left: 10px;
        }

        .dpad-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 1.2rem;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .dpad-btn:active, .action-btn:active {
            background: rgba(255, 209, 220, 0.6);
        }

        #btn-up { top: 0; left: 45px; width: 50px; height: 45px; }
        .dpad-middle { position: absolute; top: 47px; left: 0; width: 140px; display: flex; justify-content: space-between; }
        #btn-left { width: 45px; height: 50px; }
        #btn-right { width: 45px; height: 50px; }
        #btn-down { bottom: 0; left: 45px; width: 50px; height: 45px; }

        #action-buttons {
            position: relative;
            pointer-events: auto;
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            margin-right: 20px;
        }

        .action-btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 141, 161, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <div class="warning-content">
            <h2>Gira tu dispositivo</h2>
            <p>Para vivir mejor esta aventura romántica, por favor coloca tu celular o tablet en horizontal.</p>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="touch-controls" class="hidden">
            <div id="dpad">
                <button class="dpad-btn" id="btn-up">▲</button>
                <div class="dpad-middle">
                    <button class="dpad-btn" id="btn-left">◀</button>
                    <button class="dpad-btn" id="btn-right">▶</button>
                </div>
                <button class="dpad-btn" id="btn-down">▼</button>
            </div>

            <div id="action-buttons">
                <button class="action-btn" id="btn-interact" title="Interactuar / Siguiente">💬</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const VIRTUAL_WIDTH = 800;
        const VIRTUAL_HEIGHT = 450;
        canvas.width = VIRTUAL_WIDTH;
        canvas.height = VIRTUAL_HEIGHT;

        // Estados del juego y capítulos
        const GAME_STATE = {
            MENU: 'menu',
            CHAPTER_1: 'chapter_1',
            CHAPTER_2: 'chapter_2',
            CHAPTER_3: 'chapter_3',
            CHAPTER_4: 'chapter_4',
            CHAPTER_5: 'chapter_5',
            BOSS: 'boss',
            EPILOGUE: 'epilogue',
            LETTER: 'letter'
        };

        let currentState = GAME_STATE.MENU;

        let player = {
            x: 100,
            y: 280,
            speed: 3,
            width: 40,
            height: 60
        };

        let input = { up: false, down: false, left: false, right: false };

        // Sistema de diálogos interactivos
        let currentDialogue = 0;
        const dialogues = {
            1: [
                "Día cualquiera en la FES Acatlán. Conoces a Aliss, Isabella y Regina[cite: 3].",
                "Al principio parecen solo personas nuevas en tu vida[cite: 3, 4].",
                "Pero cuando conoces a Regina, notas algo diferente... Su presencia y su belleza llaman tu atención[cite: 3].",
                "El detalle complicado: Regina ya tenía novio[cite: 4]. Aun así, su plática se siente única y especial."
            ],
            2: [
                "Los días pasan y comienzas a convivir más con Regina en la universidad[cite: 5].",
                "Hablan de la prepa, gustos, música y relaciones pasadas[cite: 5].",
                "Empiezan a molestarse y bromear. Las conversaciones se alargan sin importar el tiempo[cite: 5, 7].",
                "Surgen los celos inevitables y la certeza de que ella ocupa un lugar diferente."
            ],
            3: [
                "Ya no puedes ignorar lo que sientes. Esperas verla y te emociona cada momento[cite: 9].",
                "Le cuentas a Aliss e Isabella que Regina te gusta demasiado y que quieres estar con ella[cite: 10].",
                "Decirlo en voz alta hace que todo se vuelva real. No vas a dejar pasar esto."
            ],
            4: [
                "21 de noviembre: Karaoke con Aliss e Isabella. Los nervios y el miedo a perder su amistad[cite: 11].",
                "Reúnes el valor y le dices que te gusta[cite: 11].",
                "Primera cita: Pizza y café en Bellas Artes. El primer beso que lo cambia todo[cite: 12].",
                "13 de enero: El picnic. Llevas dos cartas: una expresando tu amor y otra preguntándole si quiere ser tu novia[cite: 12]."
            ],
            5: [
                "Construyendo nuestra historia: su cumpleaños, la fiesta sorpresa, conocer a las familias[cite: 12, 13].",
                "Apodos especiales: Pinchecha, bebé chiquita, bebé chiquito, pots patitas, y llamar bebé a cada animal[cite: 13].",
                "Dormir en llamada, imaginar el futuro y hacer promesas que pesan y se cumplen[cite: 13]."
            ]
        };

        function setupTouchListeners() {
            const mapButton = (id, inputKey) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); input[inputKey] = true; });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); input[inputKey] = false; });
                btn.addEventListener('mousedown', () => { input[inputKey] = true; });
                btn.addEventListener('mouseup', () => { input[inputKey] = false; });
            };

            mapButton('btn-up', 'up');
            mapButton('btn-down', 'down');
            mapButton('btn-left', 'left');
            mapButton('btn-right', 'right');

            document.getElementById('btn-interact').addEventListener('click', () => {
                advanceStory();
            });
        }

        function advanceStory() {
            if (currentState === GAME_STATE.CHAPTER_1) {
                if (currentDialogue < dialogues[1].length - 1) {
                    currentDialogue++;
                } else {
                    currentDialogue = 0;
                    currentState = GAME_STATE.CHAPTER_2;
                }
            } else if (currentState === GAME_STATE.CHAPTER_2) {
                if (currentDialogue < dialogues[2].length - 1) {
                    currentDialogue++;
                } else {
                    currentDialogue = 0;
                    currentState = GAME_STATE.CHAPTER_3;
                }
            } else if (currentState === GAME_STATE.CHAPTER_3) {
                if (currentDialogue < dialogues[3].length - 1) {
                    currentDialogue++;
                } else {
                    currentDialogue = 0;
                    currentState = GAME_STATE.CHAPTER_4;
                }
            } else if (currentState === GAME_STATE.CHAPTER_4) {
                if (currentDialogue < dialogues[4].length - 1) {
                    currentDialogue++;
                } else {
                    currentDialogue = 0;
                    currentState = GAME_STATE.CHAPTER_5;
                }
            } else if (currentState === GAME_STATE.CHAPTER_5) {
                if (currentDialogue < dialogues[5].length - 1) {
                    currentDialogue++;
                } else {
                    currentDialogue = 0;
                    currentState = GAME_STATE.BOSS;
                }
            } else if (currentState === GAME_STATE.BOSS) {
                currentState = GAME_STATE.EPILOGUE;
            } else if (currentState === GAME_STATE.EPILOGUE) {
                currentState = GAME_STATE.LETTER;
            }
        }

        // Sprites pixel art personalizados de Leo y Regina
        function drawLeo(x, y) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(x + 20, y + 58, 14, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pantalón oscuro
            ctx.fillStyle = '#22223b';
            ctx.fillRect(x + 10, y + 38, 8, 20);
            ctx.fillRect(x + 22, y + 38, 8, 20);

            // Camisa blanca
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(x + 8, y + 18, 24, 22);

            // Cabeza
            ctx.fillStyle = '#fcd5ce';
            ctx.fillRect(x + 10, y + 4, 20, 16);

            // Cabello oscuro ondulado
            ctx.fillStyle = '#2b1025';
            ctx.fillRect(x + 8, y + 2, 24, 7);
            ctx.fillRect(x + 6, y + 6, 6, 8);
            ctx.fillRect(x + 28, y + 6, 6, 8);
        }

        function drawRegina(x, y) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(x + 20, y + 58, 14, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pantalones de mezclilla acampanados
            ctx.fillStyle = '#457b9d';
            ctx.fillRect(x + 10, y + 36, 8, 22);
            ctx.fillRect(x + 22, y + 36, 8, 22);

            // Blusa clara y moño rosa
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(x + 8, y + 18, 24, 20);
            ctx.fillStyle = '#ff70a6';
            ctx.fillRect(x + 16, y + 18, 8, 5);

            // Cabeza y cabello largo castaño
            ctx.fillStyle = '#fcd5ce';
            ctx.fillRect(x + 10, y + 4, 20, 16);
            ctx.fillStyle = '#4a2511';
            ctx.fillRect(x + 8, y + 2, 24, 8);
            ctx.fillRect(x + 5, y + 8, 7, 26);
            ctx.fillRect(x + 28, y + 8, 7, 26);
        }

        function drawMenu() {
            let gradient = ctx.createLinearGradient(0, 0, 0, VIRTUAL_HEIGHT);
            gradient.addColorStop(0, '#2b1035');
            gradient.addColorStop(0.5, '#6b2d5c');
            gradient.addColorStop(1, '#ff8da1');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
            ctx.shadowBlur = 10;
            ctx.fillText('LA HEROÍNA QUE SALVÓ Y CAMBIÓ MI MUNDO', VIRTUAL_WIDTH / 2, 75);

            ctx.font = '15px "Courier New", monospace';
            ctx.fillStyle = '#ffd1dc';
            ctx.fillText('Para Regina 💖', VIRTUAL_WIDTH / 2, 110);

            drawLeo(VIRTUAL_WIDTH / 2 - 50, 145);
            drawRegina(VIRTUAL_WIDTH / 2 + 10, 145);

            // Botón Nueva Aventura
            ctx.fillStyle = 'rgba(255, 141, 161, 0.9)';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(VIRTUAL_WIDTH / 2 - 140, VIRTUAL_HEIGHT / 2 + 45, 280, 55, 12);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.fillText('✨ NUEVA AVENTURA ✨', VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT / 2 + 78);
            ctx.shadowBlur = 0;
        }

        function drawChapterScreen(title, bgCol, chapterNum) {
            ctx.fillStyle = bgCol;
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            // Cabecera
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(title, VIRTUAL_WIDTH / 2, 35);

            // Personajes en escena
            drawLeo(280, 240);
            drawRegina(480, 240);

            // Caja de diálogo interactiva inferior
            ctx.fillStyle = 'rgba(26, 16, 37, 0.9)';
            ctx.strokeStyle = '#ff8da1';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(80, 315, 640, 100, 15);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffd1dc';
            ctx.font = '15px "Courier New", monospace';
            ctx.textAlign = 'left';
            
            // Mostrar texto actual del capítulo
            let text = dialogues[chapterNum][currentDialogue];
            ctx.fillText(text, 110, 355, 580);

            ctx.fillStyle = '#ffffff';
            ctx.font = '12px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.fillText('Toca el botón 💬 para continuar ➔', 700, 395);
        }

        function drawBossBattle() {
            ctx.fillStyle = '#110b1e';
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            ctx.fillStyle = '#ff4d6d';
            ctx.font = 'bold 20px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('ENFRENTAMIENTO FINAL: La Sombra', VIRTUAL_WIDTH / 2, 45);

            // Representación de la Sombra simbólica
            ctx.fillStyle = 'rgba(74, 78, 105, 0.7)';
            ctx.beginPath();
            ctx.arc(VIRTUAL_WIDTH / 2, 160, 50, 0, Math.PI * 2);
            ctx.fill();

            drawLeo(260, 260);
            drawRegina(480, 260);

            ctx.fillStyle = '#ffffff';
            ctx.font = '15px "Courier New", monospace';
            ctx.fillText('Vencemos unidos con nuestro amor incondicional[cite: 14].', VIRTUAL_WIDTH / 2, 360);
            ctx.fillStyle = '#ffd1dc';
            ctx.font = '13px "Courier New", monospace';
            ctx.fillText('Toca 💬 para superar la dificultad y avanzar al futuro.', VIRTUAL_WIDTH / 2, 395);
        }

        function drawEpilogue() {
            ctx.fillStyle = '#2d6a4f'; // Jardín de Villa Bombón
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('EPÍLOGO: Villa Bombón 🏡💖', VIRTUAL_WIDTH / 2, 45);

            // Casa Villa Bombón dibujada simbólicamente
            ctx.fillStyle = '#f4a261';
            ctx.fillRect(320, 100, 160, 120);
            ctx.fillStyle = '#e63946';
            ctx.beginPath();
            ctx.moveTo(300, 100);
            ctx.lineTo(400, 40);
            ctx.lineTo(500, 100);
            ctx.fill();

            drawLeo(340, 250);
            drawRegina(410, 250);

            ctx.fillStyle = '#ffffff';
            ctx.font = '14px "Courier New", monospace';
            ctx.fillText('Boda civil, boda por la iglesia, nuestra casa Villa Bombón', VIRTUAL_WIDTH / 2, 360);
            ctx.fillText('y nuestros hijos: Miguel Alexander y Brianna Victoria ✨', VIRTUAL_WIDTH / 2, 385);
            ctx.fillStyle = '#ffd1dc';
            ctx.font = '12px "Courier New", monospace';
            ctx.fillText('Toca 💬 para leer la carta final', VIRTUAL_WIDTH / 2, 420);
        }

        function drawLetter() {
            ctx.fillStyle = '#1a1025';
            ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.fillRect(60, 30, 680, 390);

            ctx.fillStyle = '#ff8da1';
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('Para Regina, el amor de mi vida', VIRTual_WIDTH / 2, 70);

            ctx.fillStyle = '#ffd1dc';
            ctx.font = '14px "Courier New", monospace';
            ctx.textAlign = 'left';
            let letterText = [
                "Regina, cambiaste mi vida por completo.",
                "No fue una casualidad; eres la heroína que salvó y cambió mi mundo.",
                "A pesar de todo, siempre nos hemos seguido eligiendo y lo seguiremos haciendo.",
                "Quiero seguir construyendo mi vida a tu lado en Villa Bombón.",
                "Te amo con todo mi ser. Por siempre tuyo, Leo. 💖"
            ];

            let startY = 120;
            letterText.forEach(line => {
                ctx.fillText(line, 100, startY);
                startY += 40;
            });
        }

        // Detectar toques en el Menú Principal
        canvas.addEventListener('click', (e) => {
            if (currentState === GAME_STATE.MENU) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = VIRTUAL_WIDTH / rect.width;
                const scaleY = VIRTUAL_HEIGHT / rect.height;
                const clickX = (e.clientX - rect.left) * scaleX;
                const clickY = (e.clientY - rect.top) * scaleY;

                if (clickX >= VIRTUAL_WIDTH / 2 - 140 && clickX <= VIRTUAL_WIDTH / 2 + 140 &&
                    clickY >= VIRTUAL_HEIGHT / 2 + 45 && clickY <= VIRTUAL_HEIGHT / 2 + 100) {
                    currentState = GAME_STATE.CHAPTER_1;
                    document.getElementById('touch-controls').classList.remove('hidden');
                }
            }
        });

        function gameLoop() {
            ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

            if (currentState === GAME_STATE.MENU) {
                drawMenu();
            } else if (currentState === GAME_STATE.CHAPTER_1) {
                drawChapterScreen("CAPÍTULO 1: El día en que todo comenzó", "#38b000", 1);
            } else if (currentState === GAME_STATE.CHAPTER_2) {
                drawChapterScreen("CAPÍTULO 2: Una amistad que empezaba a ser algo más", "#2a9d8f", 2);
            } else if (currentState === GAME_STATE.CHAPTER_3) {
                drawChapterScreen("CAPÍTULO 3: Cuando entendí que estoy enamorado", "#e76f51", 3);
            } else if (currentState === GAME_STATE.CHAPTER_4) {
                drawChapterScreen("CAPÍTULO 4: El 21 de noviembre y el inicio", "#d90429", 4);
            } else if (currentState === GAME_STATE.CHAPTER_5) {
                drawChapterScreen("CAPÍTULO 5: Nuestro amor y nuestra historia", "#7209b7", 5);
            } else if (currentState === GAME_STATE.BOSS) {
                drawBossBattle();
            } else if (currentState === GAME_STATE.EPILOGUE) {
                drawEpilogue();
            } else if (currentState === GAME_STATE.LETTER) {
                drawLetter();
            }

            requestAnimationFrame(gameLoop);
        }

        setupTouchListeners();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
